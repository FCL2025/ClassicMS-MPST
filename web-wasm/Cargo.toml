[package]
name = "msclassic-web"
version = "0.1.0"
edition = "2021"
description = "msclassic 核心的 wasm-bindgen 介面層（瀏覽器 Dedicated Worker 用）"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
msclassic = { path = "../src-tauri", default-features = false }
wasm-bindgen = "0.2.126"
js-sys = "0.3.103"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
